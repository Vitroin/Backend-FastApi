[project]
name = "backend-fastapi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "pydantic-settings>=2.16.0",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
